# Upstream para o Next.js
upstream nextjs_upstream {
    server nextjs:3000;
    keepalive 32;
}

# Servidor HTTP - Redirecionamento para HTTPS
server {
    listen 80;
    server_name mostrascti.com.br www.mostrascti.com.br; 
    
    # Permitir acesso ao Let's Encrypt para renovação
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        access_log off;
        try_files $uri $uri/ =404;
    }
    
    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
