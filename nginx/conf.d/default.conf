# Upstream para o Next.js
upstream nextjs_upstream {
    server nextjs:3000;
    keepalive 32;
}

# Servidor HTTP - Redirecionamento para HTTPS
server {
    listen 80;
    server_name mostrascti.com.br www.mostrascti.com.br; 
    
    # Permitir acesso ao Let's Encrypt para renovação
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        access_log off;
        try_files $uri $uri/ =404;
    }
    
    # Dashboard de analytics (GoAccess)
    location /analytics/ {
        proxy_pass http://goaccess:7890/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Auth básico para proteger o dashboard
        auth_basic "Restricted - Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
