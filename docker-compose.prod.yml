services:
  # Aplicação Next.js
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mostra-ciencia-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network
    volumes:
      - ./public:/app/public:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx como reverse proxy
  nginx:
    image: nginx:alpine
    container_name: mostra-ciencia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/auth/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - nextjs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot para Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: mostra-ciencia-certbot
    restart: "no"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email seu-email@exemplo.com --agree-tos --no-eff-email -d mostrascti.com.br -d www.mostrascti.com.br

  # GoAccess para analytics dos logs do Nginx
  goaccess:
    image: allinurl/goaccess:latest
    container_name: mostra-ciencia-goaccess
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - app-network
    volumes:
      - nginx-logs:/var/log/nginx:ro
    command: >
      /bin/sh -c "touch /var/log/nginx/access.log && goaccess /var/log/nginx/access.log \
      --real-time-html \
      --port=7890 \
      --date-format=\"%d/%b/%Y\" \
      --time-format=\"%T\" \
      --log-format=\"%h - %e [%d:%t %^] \"%r\" %s %b \"%R\" \"%u\" \"%^\"\""

networks:
  app-network:
    driver: bridge

volumes:
  nginx-logs: